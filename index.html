<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <h1>Student Register Form</h1>
</head>
<body>
    <fieldset style="border: 2px solid green;">
        <legend><h3>Personal Information</h3></legend>
        <form action="">
        <label for="">Full Name:</label>
        <input type="text" placeholder="Enter your name"> 
        <br>
        <br>
        <label for="">Email:</label>
        <input type="email" placeholder="Enter your email">
        <br>
        <br>
        <label for="">Password:</label>
        <input type="password" placeholder="Enter your password">
        <br>
        <br>
        <label for="">Date of Birth:</label>
        <input type="date">
        <br>
        <br>
        <label for="">Gender:</label>
        <input type="radio"  name="gender">Male
        <input type="radio"  name="gender">Female
        <input type="radio"  name="gender">Other
        <br>
        <br>
        <label for="">Province:</label>
        <select>
            <option>BTB</option>
            <option>PP</option>
            <option>BMC</option>
            <option>PS</option>
            <option>KD</option>
            <option>KP</option>
        </select>
        <br>
        <br>
        <label for="">Phone Number:</label>
        <input type="text">
    </fieldset>
    <br>
    <fieldset style="border: 2px solid yellow;">
        <legend><h3>Academic Information</h3></legend>
        <label for="">Student ID:</label>
        <input type="text">
        <br>
        <br>
        <label for="">Major:</label>
        <select>
            <option>Select Major</option>
            <option>IT</option>
            <option>BM</option>
            <option>FN</option>
            <option>AD</option>
        </select>
        <br>
        <br>
        <label for="">Skills:</label>
        <input type="checkbox" name="Major">HTML
        <input type="checkbox" name="Major">CSS
        <br>
        <br>
        <label for="">Upload Photo:</label>
        <input type="file">
    </fieldset>
    <br><br>
    <fieldset style="border: 2px solid red;">
        <legend><h3>Additional Information</h3></legend>
        <label for="">Adress:</label><br>
        <textarea name="" rows="10" cols="40"></textarea>
        <br><br>
        <label for="">Personal Website:</label>
        <input type="text">
        <br><br>
        <label for="">Favorite Color:</label>
        <input type="color">
    </fieldset>
    <br><br>
    <input type="checkbox"> I agree to the registration terms.
    <br><br>
    <button type="submit">  <a href="studetCard.html">Register</a></button>
    <button type="submit">Clear Form</button>
        </form>
</body>
</html>
